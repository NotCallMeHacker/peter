# One compose file for the entire stack: self-hosted Supabase (./supabase) + web app (./web).
#
# Usage
#   Start everything:   docker compose up
#   Start without web:  docker compose -f docker-compose.yml -f docker-compose.no-web.yml up
#   Web app only:       docker compose up -d web
#   Web app dev:        cd web && npm run dev  (no-web stack + next dev on :3000)
#   Supabase only:      cd supabase && sh run.sh start
#   Stop:               docker compose down
#   Reset Supabase:     cd supabase && sh reset.sh
#   Keys & secrets:     cd supabase && sh utils/generate-keys.sh --update-env
#
# The Supabase stack is kept verbatim from upstream in ./supabase and pulled in
# with `include`: each included file resolves its own relative paths (./volumes/...)
# and interpolates variables from ./supabase/.env. Configure the stack there.
# Set WEB_PORT in a root .env to change the web app's host port (default 3000).

name: peter

include:
  # Optional upstream layers: uncomment to add to the merge list below.
  # Each layer must stay in THIS SAME path list to merge with the base stack
  # (separate include entries do not merge with each other).
  - path:
      - supabase/docker-compose.yml
    env_file: supabase/.env
      # - supabase/docker-compose.logs.yml   # Logflare + Vector (Studio logs UI)
      # - supabase/docker-compose.s3.yml     # S3 storage backend (MinIO)
      # - supabase/docker-compose.rustfs.yml # S3 storage backend (RustFS)
      # - supabase/docker-compose.pg15.yml   # pin Postgres 15
      # - supabase/docker-compose.kong.yml   # Kong instead of Envoy

services:
  # Next.js web app. Session gate + kanban reads: GoTrue issues the access
  # token, the server forwards it to PostgREST (server-mediated, RLS verified).
  # Keep the host port at 3000 — GoTrue's GOTRUE_SITE_URL points there.
  web:
    container_name: web
    build: ./web
    restart: unless-stopped
    ports:
      - ${WEB_PORT:-3000}:3000
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: 3000
      DB_SCHEMA: ${DB_SCHEMA:-app}
      # Supabase REST API (PostgREST) — the kanban board reads the app schema
      # from it; inside the compose network the gateway is api-gw:8000.
      # Only the anon key (needed as the `apikey` header) reaches the app:
      # identity travels in the GoTrue session token, so there is no
      # SUPABASE_JWT_SECRET here — and no DB_* credentials: the app has no
      # direct Postgres access (sequelize-cli migrations run on the host).
      SUPABASE_URL: ${SUPABASE_URL:-http://api-gw:8000}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Set SUPABASE_ANON_KEY in .env (copy it from supabase/.env)}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/').then((r) => {if (r.status !== 200) throw new Error(r.status)})\""
        ]
      timeout: 10s
      interval: 5s
      retries: 3
      start_period: 20s
    # Uncomment to start only after the API gateway is healthy:
    # depends_on:
    #   api-gw:
    #     condition: service_healthy

  # Expose Postgres directly on host for local dev tools (bypasses pooler)
  db:
    ports:
      - "5433:5432"
