services:
  supertokens:
    container_name: supertokens
    image: registry.supertokens.io/supertokens/supertokens-postgresql
    restart: unless-stopped
    ports:
      - "3567:3567"
    environment:
      POSTGRESQL_USER: postgres
      POSTGRESQL_HOST: db
      POSTGRESQL_PORT: 5432
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in supabase/.env}
      POSTGRESQL_DATABASE_NAME: ${POSTGRES_DB:-postgres}
      # Move SuperTokens tables out of public into their own schema.
      # (config.yaml's postgresql_table_schema is the native knob; the
      # POSTGRESQL_TABLE_SCHEMA env var maps to it. The JDBC
      # currentSchema=... URL param does NOT work — ST uses its own SQL layer.)
      POSTGRESQL_TABLE_SCHEMA: supertokens
    depends_on:
      db:
        condition: service_healthy
